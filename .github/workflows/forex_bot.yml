name: FINSIDE Forex & Gold 24/5 Scanner

on:
  workflow_dispatch:

concurrency:
  group: forex-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forex-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install openpyxl

      - name: Run FINSIDE Forex Scanner
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FOREX_BOT_TOKEN: ${{ secrets.FOREX_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python finside_forex_gha.py

      - name: Save Paper Trading State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add forex_zing_state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: update forex paper trading state [skip ci]"
            git pull --rebase -X ours origin main
            git push origin main
          fi
